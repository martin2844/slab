services:
  slab-migrate:
    image: martin2844/slab:latest
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      TRACKER_DB_PATH: /data/slab.db
    volumes:
      - slab-data:/data
    restart: "no"

  slab-api:
    image: martin2844/slab:latest
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-6970}:6970"
    environment:
      PORT: "6970"
      TRACKER_API_KEY: "${TRACKER_API_KEY:?Set TRACKER_API_KEY in .env}"
      TRACKER_DB_PATH: /data/slab.db
      SKIP_MIGRATIONS: "true"
    volumes:
      - slab-data:/data
    restart: unless-stopped
    depends_on:
      slab-migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6970/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  slab-mcp:
    image: martin2844/slab:latest
    command: ["node", "dist/mcp/server.js"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TRACKER_MCP_PORT:-6969}:6969"
    environment:
      TRACKER_MCP_PORT: "6969"
      TRACKER_MCP_MODE: http
      TRACKER_API_KEY: "${TRACKER_API_KEY:?Set TRACKER_API_KEY in .env}"
      TRACKER_DB_PATH: /data/slab.db
      SKIP_MIGRATIONS: "true"
    volumes:
      - slab-data:/data
    restart: unless-stopped
    depends_on:
      slab-migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6969/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  slab-data:
