services:
  slab-api:
    build: .
    environment:
      PORT: "6970"
      TRACKER_API_KEY: "${TRACKER_API_KEY:?Set TRACKER_API_KEY in Coolify}"
      TRACKER_DB_PATH: /data/slab.db
    expose:
      - "6970"
    volumes:
      - slab-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6970/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  slab-mcp:
    build: .
    command: ["node", "dist/mcp/server.js"]
    environment:
      TRACKER_MCP_PORT: "6969"
      TRACKER_MCP_MODE: http
      TRACKER_API_KEY: "${TRACKER_API_KEY:?Set TRACKER_API_KEY in Coolify}"
      TRACKER_DB_PATH: /data/slab.db
    expose:
      - "6969"
    volumes:
      - slab-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6969/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  slab-data:
